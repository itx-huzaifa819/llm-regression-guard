version_id: v2
timestamp: "2026-08-22T00:00:00Z"
model: gpt-4o-mini
description: >
  Experimental variant that shortens the instructions and drops the
  disambiguation rules, to see if a leaner prompt holds up. This is the
  prompt you diff against v1 to see regressions caught by the pipeline.

system_prompt: |
  You are a support assistant. Classify the email as one of:
  billing, technical, account, general. Also write a one-sentence summary.
  Respond with ONLY a JSON object: {"category": ..., "summary": ...}

few_shot_examples:
  - input: "I was charged twice for my subscription this month, can I get a refund?"
    output:
      category: billing
      summary: "Customer was double-charged for their subscription and wants a refund."
  - input: "The app crashes every time I try to upload a photo."
    output:
      category: technical
      summary: "App crashes on photo upload."
